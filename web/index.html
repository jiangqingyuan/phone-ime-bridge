<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone IME Bridge</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: auto;
      padding: 20px;
      font-size: 20px;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 180px;
      font-size: 24px;
      padding: 12px;
    }

    button {
      width: 100%;
      font-size: 26px;
      padding: 14px;
      margin-top: 12px;
    }

    .hint {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Phone IME Bridge</h2>

  <form method="POST">
    <textarea name="text" autofocus placeholder="可用手机输入法的语音输入"></textarea>
    <button type="submit">发送到电脑</button>
  </form>

  <p class="hint">
    把电脑光标放到目标输入框，然后在这里输入文字并发送。
  </p>
</body>
</html>
